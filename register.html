<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>অভিনয়ঘর | Registration</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#0b0b0f;
  color:#fff;
  padding:25px 16px;
}

.form-box{
  max-width:650px;
  margin:auto;
  background:#15151b;
  border:1px solid #292930;
  border-radius:18px;
  padding:30px 22px;
}

h1{text-align:center;margin-bottom:8px}

.subtitle{
  text-align:center;
  color:#aaa;
  margin-bottom:28px;
}

label{
  display:block;
  margin:18px 0 7px;
  font-weight:bold;
}

input,select,textarea{
  width:100%;
  padding:13px;
  border-radius:8px;
  border:1px solid #383842;
  background:#0d0d12;
  color:#fff;
  font-size:15px;
}

textarea{
  min-height:110px;
  resize:vertical;
}

button{
  width:100%;
  margin-top:28px;
  padding:15px;
  border:0;
  border-radius:8px;
  background:#d4af37;
  color:#111;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.note{
  margin-top:18px;
  text-align:center;
  color:#888;
  font-size:13px;
}

.back{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#d4af37;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="form-box">

<h1>Model & Talent Registration</h1>

<p class="subtitle">অভিনয়ঘরের সঙ্গে যুক্ত হতে আপনার তথ্য দিন</p>

<form id="registrationForm">

<label>পূর্ণ নাম *</label>
<input id="name" type="text" placeholder="আপনার পূর্ণ নাম" required>

<label>বয়স *</label>
<input id="age" type="number" placeholder="আপনার বয়স" required>

<label>মোবাইল নম্বর *</label>
<input id="phone" type="tel" placeholder="01XXXXXXXXX" required>

<label>ইমেইল</label>
<input id="email" type="email" placeholder="আপনার ইমেইল">

<label>আপনি কোন ক্ষেত্রে আগ্রহী? *</label>
<select id="category" required>
<option value="">একটি নির্বাচন করুন</option>
<option value="অভিনয়">অভিনয়</option>
<option value="মডেলিং">মডেলিং</option>
<option value="উভয়ই">উভয়ই</option>
<option value="অন্যান্য">অন্যান্য</option>
</select>

<label>অভিজ্ঞতা</label>
<textarea id="experience" placeholder="আপনার অভিনয়/মডেলিংয়ের অভিজ্ঞতা থাকলে লিখুন"></textarea>

<label>নিজের সম্পর্কে কিছু বলুন</label>
<textarea id="about" placeholder="সংক্ষেপে নিজের সম্পর্কে লিখুন"></textarea>

<label>প্রোফাইল ছবি</label>
<input id="photo" type="file" accept="image/*">

<label>CV / Resume</label>
<input id="cv" type="file" accept=".pdf,.doc,.docx">

<button type="submit">Registration Submit করুন</button>

<p class="note">
আপনার তথ্য গোপন রাখা হবে এবং প্রয়োজন অনুযায়ী যোগাযোগ করা হবে।
</p>

<a class="back" href="index.html">← Home Page-এ ফিরে যান</a>

</form>
</div>

<script>
const SUPABASE_URL = "https://vkhhznfhutskmcutnron.supabase.co";
const SUPABASE_KEY = "YOUR_PUBLISHABLE_KEY";sb_publishable_N5HBeMAoKu4XlbCHnvClLQ_GQm9R-lx

document.getElementById("registrationForm").addEventListener("submit", async function(e){

  e.preventDefault();

  const data = {
    name: document.getElementById("name").value,
    age: Number(document.getElementById("age").value),
    phone: document.getElementById("phone").value,
    email: document.getElementById("email").value,
    category: document.getElementById("category").value,
    experience: document.getElementById("experience").value,
    about: document.getElementById("about").value
  };

  try {

    const response = await fetch(
      SUPABASE_URL + "/rest/v1/model_applications",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY,
          "Prefer": "return=minimal"
        },
        body: JSON.stringify(data)
      }
    );

    if (!response.ok) {
      const error = await response.text();
      alert("❌ আবেদন জমা হয়নি:\n" + error);
      return;
    }

    alert("❤️ আবেদন সফলভাবে জমা হয়েছে!");
    this.reset();

  } catch(error) {
    alert("❌ সংযোগে সমস্যা হয়েছে।");
    console.error(error);
  }

});
</script>

</body>
</html>
