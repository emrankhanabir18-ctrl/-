<label>পূর্ণ নাম *</label>

<select required>

<option>মডেলিং</option>
<option>উভয়ই</option>

</select>

<label>অভিজ্ঞতা</label>
<textarea placeholder="আপনার অভিনয়/মডেলিংয়ের অভিজ্ঞতা থাকলে লিখুন"></textarea>
